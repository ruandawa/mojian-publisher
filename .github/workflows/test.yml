name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      MOJIAN_DATA: ${{ runner.temp }}/mojian-test-data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Ensure Edge is available for simulated browser tests
        run: python -m playwright install msedge
      - name: Check dependencies
        run: python -m pip check
      - name: Check frontend syntax
        shell: pwsh
        run: |
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check web/control.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test using temporary fixtures
        run: python -m unittest discover -s tests -q
      - name: Generate portable import sample
        run: python -m samples.build_example
      - name: Assemble allowlisted source package
        run: python package_source.py
